[workspace]

[package]
name = "qdrant-edge-cabi"
# Binding release line, equal to the C# `NativeLoader.ExpectedVersion`.
# The underlying engine (`qdrant-edge-ffi`, see ffi/Cargo.toml) stays on its
# own line; bump together by hand when the engine moves.
version = "0.10.0"
authors = ["Qdrant Team <info@qdrant.tech>"]
license = "Apache-2.0"
edition = "2024"

[lib]
# The C# side loads this by a fixed name (`NativeMethods.LibraryName`), so the
# cdylib must be `libqdrant_edge.so` / `qdrant_edge.dll`, not the package name.
name = "qdrant_edge"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Engine sources live in the pinned `third_party/qdrant` submodule
# (qdrant @ 016542aa; the C ABI depends on its engine types). A plain
# `git clone --recurse-submodules` provides it; this crate intentionally
# stays out of the upstream workspace so that repo is untouched.
edge = { path = "../../third_party/qdrant/lib/edge" }
segment = { path = "../../third_party/qdrant/lib/segment", default-features = false }
# default-features = false drops shard's `default = ["api"]` (the gRPC/prost
# `api` types crate), which this crate never uses — matching the `edge` and
# `edge-ffi` crates. `tokio` remains: `common` uses it for snapshot tar
# extraction and budget semaphores.
shard = { path = "../../third_party/qdrant/lib/shard", default-features = false }
sparse = { path = "../../third_party/qdrant/lib/sparse" }

serde_json = { version = "~1.0", features = ["preserve_order"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
