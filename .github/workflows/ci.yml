name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: timeout 600 dotnet build Qdrant.Edge.sln -c Release --no-incremental
      - name: Test
        run: timeout 1200 dotnet test Qdrant.Edge.sln -c Release --logger "trx;LogFileName=ci.trx" --logger "console;verbosity=normal"
